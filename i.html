function toLeet(text, percentage) {
//console.log("Input " + text)
const leetMap = {
    'a': '4', 'A': '4',
    'e': '3', 'E': '3',
    'i': '1', 'I': '1',
    'o': '0', 'O': '0',
    's': '5', 'S': '5',
    't': '7', 'T': '7',
    'b': '8', 'B': '8',
    'g': '9', 'G': '9',
    'z': '2', 'Z': '2'
};

const chars = text.split('');
const convertibleIndices = [];

// Find all indices of convertible characters
chars.forEach((char, index) => {
    if (leetMap[char] !== undefined) {
        convertibleIndices.push(index);
    }
});

// Calculate how many to convert
const totalConvertible = convertibleIndices.length;
const toConvert = Math.floor(totalConvertible * percentage / 100);

// Shuffle the indices and take the first 'toConvert' ones
const shuffled = [...convertibleIndices].sort(() => 0.5 - Math.random());
const indicesToConvert = shuffled.slice(0, toConvert);

// Perform the conversion
indicesToConvert.forEach(index => {
    chars[index] = `<span class="red">${leetMap[chars[index]]}</span>`;
});
return chars.join('');
}

function formatBits(bits) {
    // MMMMMMM Delicious. 
    const units = ["b", "B", "KB", "MB", "GB", "TB", "PB"];
    let value = bits;
    let index = 0;
    while (
        (index === 0 && value >= 8) ||
        (index > 0 && value >= 1024 && index < units.length - 1)
    ) {
        value = index === 0 ? value / 8 : value / 1024;
        index++;
    }
return `${value.toFixed(2)} ${units[index]}`;
}
    
function countFiles() {
    let count = 0;
    function traverse(obj) {
        for (let key in obj) {
        if (obj[key].type != "dir" && obj[key].type != "hidden") {
            count++;
        } else if (obj[key].children) {
            traverse(obj[key].children);
        }
        }
    }
    traverse(fileSystem['/'].children);
    return count;
}

function getFileGeneratorByName(name) {
    return fileGenerators.find(gen => gen.name === name);
}

function addFileGeneratorToFS(genName) {
    const gen = getFileGeneratorByName(genName);
    if (!gen) return false;

    const currentDir = getCurrentDirectory();
    if (currentDir && currentDir.children) {
        // Ensure unique filename
        let filename = gen.name;
        let counter = 1;
        while (currentDir.children[filename]) {
            filename = gen.name.replace('.', `(${counter}).`);
            counter++;
        }
        currentDir.children[filename] = {
            type: 'sys',
            corrupt: 0,
            contents: `File Generator: ${gen.name}<br>Rate: ${gen.rate} BPS<br>Cost: ${gen.cost} bits<br>Description:<br>- ${gen.desc.join('<br>- ')}`
        };
        return true;
    }
    return false;
}

function getCurrentDirectory() {
    const path = gameState.currentPath.split('/').filter(p => p);
    let current = fileSystem['/'];
    
    for (let part of path) {
        if (current.children && current.children[part]) {
            current = current.children[part];
        } else {
            return null;
        }
    }
    return current;
}

function getFileInCurrentDirectory(filename) {
    const currentDir = getCurrentDirectory();
    if (currentDir && currentDir.children && currentDir.children[filename]) {
        return currentDir.children[filename];
    }
    return null;
}

cmd({
    name: "cat",
    desc: "Display file contents.",
    usage: "cat <filename>",
    exec: function(args){
        if (!args[0]) {
            addOutput("<span class=\"error\">cat: missing file operand</span>");
            addToErrors();
            return;
        }
        
        const file = getFileInCurrentDirectory(args[0]);
        if (!file) {
            addOutput(`<span class="error">cat: ${args[0]}: No such file</span>`);
            addToErrors();
            return;
        }
        
        if (file.type === 'dir') {
            addOutput(`<span class="error">cat: ${args[0]}: Is a directory</span>`);
            addToErrors();
            return;
        }
        
        let content = file.contents || "Binary file - content cannot be displayed";
        
        // Apply corruption to file content
        if (gameState.started && file.corrupt > 0) {
            const corruptPercent = Math.min(file.corrupt / 10, 50); // Max 50% corruption display
            content = toLeet(content, corruptPercent);
        }
        
        addOutput(`<div class="file-content">${content}</div>`);
    }
});

                gameState.currentPath = '/' + parts.join('/');
                if (gameState.currentPath === '/') gameState.currentPath = '/';
            }

            gameState.currentPath = targetPath;

                gameState.currentPath = '/' + targetPath;

                gameState.currentPath += '/' + targetPath;
            }

            // Revert path change
            gameState.currentPath = p;

var lastCommands = [];
var commandIndex = 0;

function executecmd(input) {
    input = input.trim();
    if (input.trim() != '') lastCommands.push(input);
    commandIndex = 0;
    // First push the cmd:
    cmdFound = false;
    filePath = gameState.currentPath.replace('/usr/guest', '~');
    addOutput(`<span class="prompt">${gameState.user}@${gameState.host}:${filePath}$</span> ${input}`);
    // Handle args 
    if (!input.trim()) return;
    const args = input.split(' ');
    if (multiStage.active) {
        if (multiStage.name === "confirm") {
            const response = args[0].toLowerCase();
            if (response === 'y' || response === 'yes') {
                multiStage.callback(true);
            } else {
                multiStage.callback(false);
            }
            multiStage.active = false;
            multiStage.name = null;
            multiStage.stage = 0;
            multiStage.data = {};
            multiStage.callback = null;
            return;
        }
        multistage.callback(args);
        return;
    }
    var cmdName = args.shift().toLowerCase();
    for (var i = 0; i < cmdsAvailable.length; i++) {
        if (cmdsAvailable[i].toLowerCase() === cmdName || (cmdsBN[cmdsAvailable[i]].aliases && cmdsBN[cmdsAvailable[i]].aliases.includes(cmdName))) {
            cmdName = cmdsAvailable[i];
            cmdFound = true;
            break;
        }
    }
    if (!cmdFound) {
        addOutput(`<span class="error">Command not found: ${cmdName}</span>`);
        addToErrors();
        return;
    }
    const cmd = cmdsBN[cmdName];
    if (cmd) {
        try {
            
            cmd.exec(args);
        } catch (e) {
            addOutput(`<span class="error">Error executing Command: ${e.message}</span>`);
            addToErrors();
            console.error(e);
        }
    }
    return;
}


function startGame(){

    l('bps-word').innerHTML = `BPS: <span id="bps">1</span>`

    setTimeout(() => {

    }, 5000);

}
function triggerEvent(event){
    addOutput("Incoming Message, do you accept? (y/n)");
    setTimeout(() => {
        if (multiStage.name == "eventHandler" || !gameState.cooldowns[eventToTrigger.id]) {
            addOutput("<span class=\"error\">Event timed out.</span>");
            cancel();
        }
    }, 30000); // 30 second timeout

    multiStage.active = true;
    multiStage.name = "eventHandler",
    multiStage.stage = 0;
    multiStage.data = {event: event};
    multiStage.callback = function(response){
        if (response[0].toLowerCase() === 'y' || response[0].toLowerCase() === 'yes') {
            gameState.cooldowns[eventToTrigger.id] = now;
            event.effect();
        } else {
            addOutput("Event declined.");
            cancel();
        }
}

function handleEvents(){
    const now = Date.now();
    var possibleEffects = [];
    for (let ev of events) {
        if (!ev.check()) continue;
        if (gameState.cooldowns[ev.id] && now - gameState.cooldowns[ev.id] < ev.cooldown) continue;
        possibleEffects.push(ev);
    }
    if (possibleEffects.length === 0) return;
    const eventToTrigger = possibleEffects[Math.floor(Math.random() * possibleEffects.length)];
    triggerEvent(eventToTrigger);
}


function gameLoop(){
    handleEvents();
    if (!gameState.started) return;
    // Recalculate BPS
    let totalBPS = 1; // Base BPS
    for (let gen of gameState.generators) {
        totalBPS += gen.rate;
        // Scale rate based on scaling type
        if (gen.scaling) {
            let scaleValue = 0;
            switch (gen.scaling.type) {
                case "commandCount":
                    scaleValue = gameState.stats.commandsRun;
                    break;
                case "timeActive":
                    scaleValue = gameState.stats.timeActive;
                    break;
                case "fileCount":
                    scaleValue = gameState.stats.filesCreated;
                    break;
                case "errorCount":
                    scaleValue = gameState.stats.errorsEncountered;
                    break;
                case "userCount":
                    scaleValue = gameState.stats.usersCreated;
                    break;
                case "hostsInfected":
                    scaleValue = gameState.stats.hostsInfected;
                    break;
                default:
                    scaleValue = 0;
            }
            totalBPS += Math.floor(gen.rate * gen.scaling.multiplier * scaleValue);
        }
    }
    gameState.bps = totalBPS;
    // Add bits
    gameState.bits += gameState.bps;
    gameState.corruption += gameState.bps;
    
    updateUI()
}

    var driveUI = l('drive-size');
    if (!gameState.started) { // Only needs to trigger once
        driveUI.innerHTML = `<span>Drive Size: <span class="blu">${formatBits(fileSystem.size)}</span></span>`;
        l('file-count').innerHTML = countFiles();
    return;
    }

if (e.key === 'Enter') {
    const input = this.value;
    if (input.trim()) {
        addToCommands();  
    }
    executecmd(input);
    this.value = '';
}
});

document.getElementById('cmd-input').addEventListener('keydown', function(e) {
    if (e.key === 'ArrowUp') {
        if (lastCommands.length === 0) return;
        commandIndex = Math.min(commandIndex + 1, lastCommands.length);
        this.value = lastCommands[lastCommands.length - commandIndex] || '';
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        if (lastCommands.length === 0) return;
        commandIndex = Math.max(commandIndex - 1, 0);
        this.value = lastCommands[lastCommands.length - commandIndex] || '';
        e.preventDefault();
    }
});
